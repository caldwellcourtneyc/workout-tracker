<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14101b">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14101b; --card:#201a2c; --card-done:#2b1830; --line:#342b45; --line2:#3f3550;
    --ink:#f3eef9; --ink2:#b7aacb; --ink3:#857999;
    --magenta:#ff45b5; --magenta-soft:#34122b;
    --violet:#9a7dff; --violet-btn:#7c54e8; --violet-soft:#2a2247; --violet-ink:#c6b4ff;
    --track:#2f2842; --field:#1a1426;
    --display:'Gabarito',system-ui,sans-serif; --body:'Onest',system-ui,sans-serif; --rad:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:var(--body); -webkit-font-smoothing:antialiased; line-height:1.4; overscroll-behavior-y:none;}
  .app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative;}
  .view{flex:1; padding:18px 16px 110px; overflow-y:auto;}
  h1,h2,h3,.display{font-family:var(--display); letter-spacing:-0.01em;}

  .vhead{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--magenta);}
  .vtitle{font-family:var(--display); font-weight:700; font-size:27px; color:var(--ink); margin-top:3px;}

  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:15px; border-radius:13px; padding:13px 16px; transition:transform .08s, filter .15s; text-decoration:none;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--violet-btn); color:#fff;}
  .btn-magenta{background:var(--magenta); color:#1a0a14;}
  .btn-ghost{background:transparent; color:var(--violet-ink); border:1.5px solid var(--violet-soft);}
  .btn-soft{background:var(--violet-soft); color:var(--violet-ink);}
  .btn-sm{padding:9px 13px; font-size:13.5px; border-radius:11px;}
  .btn-block{width:100%;}
  .icobtn{width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; background:var(--field); border:1px solid var(--line); color:var(--violet-ink);}
  .icobtn:active{transform:scale(.96);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--rad); padding:15px;}
  .muted{color:var(--ink2);} .muted3{color:var(--ink3);}

  .wcard{display:flex; align-items:center; gap:14px; margin-bottom:12px; padding:16px 15px; width:100%; text-align:left;}
  .wcard .wbody{flex:1; min-width:0;}
  .wcard .wname{display:block; font-family:var(--display); font-weight:700; font-size:18px; color:var(--ink);}
  .wcard .wmeta{display:block; font-size:13px; color:var(--ink2); margin-top:2px;}
  .wcard .chev{color:var(--ink3);}
  .pill-count{font-family:var(--display); font-weight:800; font-size:13px; color:var(--violet-ink); background:var(--violet-soft); border-radius:999px; padding:5px 11px; flex:none;}
  .phase-label{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); margin:18px 4px 9px;}

  .ring-wrap{position:relative; width:62px; height:62px; flex-shrink:0;}
  .ring-fg{transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);}
  .datechip{font-size:12.5px; color:var(--ink2); font-weight:600; margin-bottom:16px;}
  .sessionbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .sessionbar .datechip{margin-bottom:0;}
  .wp-block{margin-bottom:22px;}
  .wp-exname{font-family:var(--display); font-weight:700; font-size:17px; color:var(--ink); margin:0 2px 10px;}

  .ex{margin-bottom:12px; padding:15px; transition:background .2s, border-color .2s;}
  .ex.done{background:var(--card-done); border-color:#54264a;}
  .ex-head{display:flex; align-items:flex-start; gap:10px;}
  .ex-head .exinfo{flex:1; min-width:0;}
  .exnm{font-family:var(--display); font-weight:700; font-size:17px; line-height:1.2; color:var(--ink);}
  .exmodel{font-size:11.5px; color:var(--ink3); margin-top:2px;}
  .chips{display:flex; align-items:center; gap:7px; margin-top:10px; flex-wrap:wrap;}
  .chip{font-size:11.5px; font-weight:600; height:26px; padding:0 11px; border-radius:999px; background:#262031; color:#b0a3c4; display:inline-flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap; flex:0 0 auto;}
  .chip.loc{background:var(--violet-soft); color:var(--violet-ink); font-weight:700;}
  .chip.addloc{background:var(--field); color:var(--ink3); font-weight:600; border:1px dashed var(--line2);}
  .chip.formchip{background:var(--magenta-soft); color:#ff9ed8; font-weight:700; border:1px solid #582244;}
  .chip svg{width:11px; height:11px; flex:none;}
  .tgt{font-size:12px; color:var(--ink3); font-weight:600; margin-left:auto;}

  .sets{margin-top:13px; display:flex; flex-direction:column; gap:8px;}
  .setrow{display:flex; align-items:center; gap:9px;}
  .setlabel{font-family:var(--display); font-weight:700; font-size:12px; color:var(--ink3); width:34px;}
  .fieldwrap{flex:1; display:flex; align-items:center; gap:5px; background:var(--field); border:1px solid var(--line); border-radius:11px; padding:0 11px; height:46px; transition:border-color .15s;}
  .fieldwrap:focus-within{border-color:var(--magenta);}
  .fieldwrap input{border:none; background:none; outline:none; width:100%; font-family:var(--display); font-weight:700; font-size:18px; color:var(--ink); min-width:0;}
  .fieldwrap input::placeholder{color:var(--ink3);}
  .fieldwrap .u{font-size:12px; font-weight:600; color:var(--ink3); white-space:nowrap;}
  .check{width:46px; height:46px; border-radius:12px; border:1.5px solid var(--line2); background:var(--field); display:flex; align-items:center; justify-content:center; color:var(--ink3); flex-shrink:0; transition:.15s;}
  .check.on{background:var(--magenta); border-color:var(--magenta); color:#1a0a14;}
  .check.on:active{transform:scale(.94);}
  .addrow{display:flex; gap:9px; margin-top:6px;}

  .selectwrap{position:relative; margin-bottom:18px;}
  select{width:100%; font-family:var(--display); font-weight:700; font-size:16px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px 40px 14px 15px; appearance:none; outline:none;}
  .selectwrap .car{position:absolute; right:15px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink3);}
  .stat-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px 14px;}
  .stat .lab{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3);}
  .stat .val{font-family:var(--display); font-weight:800; font-size:24px; margin-top:3px; color:var(--ink);}
  .stat .val .su{font-size:13px; color:var(--ink3); font-weight:600;}
  .chart-card{padding:16px 14px 10px;}
  .empty{text-align:center; color:var(--ink3); padding:46px 20px;}
  .empty .big{font-family:var(--display); font-weight:700; font-size:18px; color:var(--ink2); margin-bottom:6px;}

  .drow{display:flex; align-items:center; gap:13px; padding:15px; margin-bottom:11px; width:100%; text-align:left;}
  .drow .di{width:42px; height:42px; border-radius:12px; background:var(--violet-soft); color:var(--violet-ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .drow .dbody{flex:1; min-width:0;}
  .drow .dt{display:block; font-family:var(--display); font-weight:700; font-size:15px; color:var(--ink);}
  .drow .ds{display:block; font-size:12.5px; color:var(--ink2); margin-top:2px; line-height:1.45;}
  .status-ok{color:var(--violet-ink); font-weight:700;}

  .nav{position:fixed; left:0; right:0; bottom:0; background:rgba(20,16,27,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  .nav .navinner{max-width:520px; margin:0 auto; width:100%; display:flex;}
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0; color:var(--ink3); font-size:11px; font-weight:600;}
  .navbtn.on{color:var(--magenta);}
  .navbtn svg{width:23px; height:23px;}

  .scrim{position:fixed; inset:0; background:rgba(8,5,12,.6); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .scrim.show{display:flex;}
  .sheet{background:var(--bg); width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; border-top:1px solid var(--line);}
  .sheet h2{font-size:21px; font-weight:700; margin-bottom:4px; color:var(--ink);}
  .sheet .sub{color:var(--ink2); font-size:13.5px; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink2); margin-bottom:6px;}
  .field input, .field textarea{width:100%; font-family:var(--body); font-size:15px; color:var(--ink); background:var(--field); border:1px solid var(--line); border-radius:11px; padding:12px 13px; outline:none;}
  .field input:focus, .field textarea:focus{border-color:var(--magenta);}
  .field input::placeholder{color:var(--ink3);}
  .field textarea{resize:vertical; min-height:54px;}
  .field-2{display:flex; gap:11px;} .field-2 .field{flex:1;}
  .scopegrid{display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:14px;}
  .scopecard{display:flex; align-items:flex-start; gap:10px; font-size:13.5px; font-weight:600; color:var(--ink2); background:var(--field); border:1px solid var(--line); border-radius:11px; padding:12px 13px; cursor:pointer;}
  .scopecard input{width:18px; height:18px; accent-color:var(--magenta); flex:none; margin-top:1px;}
  .scopecard strong{display:block; color:var(--ink); font-family:var(--display); font-size:14.5px; margin-bottom:2px;}
  .sheet-actions{display:flex; gap:10px; margin-top:8px;}
  .linkdanger{color:#ff6f9c; font-weight:700; font-size:13.5px; background:none; padding:8px; margin-top:4px;}
  .permrow{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; color:var(--ink2); background:var(--field); border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:6px; cursor:pointer;}
  .permrow input{width:18px; height:18px; accent-color:var(--magenta); flex:none;}
  .rmrow{display:flex; gap:14px; flex-wrap:wrap;}
  .form-media{position:relative; width:100%; aspect-ratio:16/9; background:#09070d; border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:14px 0 17px;}
  .form-media iframe,.form-media video{display:block; width:100%; height:100%; border:0; object-fit:contain;}
  .form-media-fallback{height:100%; display:flex; align-items:center; justify-content:center; padding:22px; color:var(--ink2); text-align:center; font-size:13.5px;}
  .form-source-link{color:var(--violet-ink); text-decoration:none;}
  .form-source-link:hover{text-decoration:underline;}
  .form-section{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px 15px; margin-bottom:10px;}
  .form-section-title{font-family:var(--display); font-weight:700; font-size:14px; color:var(--ink); margin-bottom:8px;}
  .form-cues{padding-left:20px; color:var(--ink2); font-size:13.5px; line-height:1.55;}
  .form-cues li+li{margin-top:5px;}
  .form-watch{color:#ffc0d9; background:var(--magenta-soft); border-color:#582244; font-size:13.5px; line-height:1.5;}
  .form-note{font-size:11.5px; color:var(--ink3); text-align:center; margin-top:12px; line-height:1.45;}
  .guide-fields{border-top:1px solid var(--line); margin-top:4px; padding-top:15px;}
  .guide-fields .group-label{font-family:var(--display); font-size:15px; font-weight:700; color:var(--ink); margin-bottom:3px;}
  .guide-fields .group-help{font-size:12px; color:var(--ink3); margin-bottom:13px;}
  .summary{display:flex; align-items:center; gap:14px; margin-bottom:16px; padding:15px; width:100%; text-align:left;}
  .summary .snum{font-family:var(--display); font-weight:800; font-size:30px; color:var(--ink); line-height:1;}
  .summary .slab{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin-top:4px;}
  .summary .sright{margin-left:auto; text-align:right;}
  .dotstrip{display:flex; gap:4px; justify-content:flex-end;}
  .dotstrip .d{width:7px; height:7px; border-radius:50%; background:var(--track);}
  .dotstrip .d.on{background:var(--magenta);}

  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;}
  .cal-title{font-family:var(--display); font-weight:700; font-size:19px; color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--ink3); padding-bottom:2px;}
  .cal-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:600; font-size:14.5px; color:var(--ink2); border-radius:11px; background:var(--field);}
  .cal-cell.blank{visibility:hidden; background:none;}
  .cal-cell.on{background:var(--magenta); color:#1a0a14; font-weight:800; cursor:pointer;}
  .cal-cell.today{outline:2px solid var(--violet); outline-offset:-2px;}
  .cal-cell.future{color:var(--line2); background:transparent;}
  .cal-legend{display:flex; align-items:center; gap:16px; margin-top:16px; font-size:12.5px; color:var(--ink2); font-weight:600;}
  .cal-legend .lg{display:inline-flex; align-items:center; gap:7px;}
  .cal-legend .sw{width:14px; height:14px; border-radius:5px;}
  .hidden{display:none !important;}
  @media (max-width:380px){ .vtitle{font-size:24px;} }
</style>
</head>
<body>
<div class="app">
  <div class="view" id="view"></div>
  <nav class="nav"><div class="navinner">
    <button class="navbtn" data-nav="workouts" onclick="go('workouts')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M8 8v8M16 8v8M5 9.5v5M19 9.5v5"/></svg>
      <span>Workouts</span></button>
    <button class="navbtn" data-nav="history" onclick="go('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
      <span>History</span></button>
    <button class="navbtn" data-nav="progress" onclick="go('progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 8"/></svg>
      <span>Progress</span></button>
    <button class="navbtn" data-nav="data" onclick="go('data')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
      <span>Data</span></button>
  </div></nav>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const LS_KEY = "braindeux_workout_v2";
let state = null;
let nav = { name:"workouts", workoutId:null, progressEx:null };
let fileHandle = null;

function uid(p){ return p + "_" + Date.now().toString(36) + Math.floor(Math.random()*1e5).toString(36); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ return new Date(iso+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }
function fmtShort(iso){ return new Date(iso+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function num(v){ const n=parseFloat(v); return isFinite(n)?n:null; }
function round(n){ return Math.round(n*100)/100; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); if(r) return JSON.parse(r); }catch(e){} return null; }

const STATE_VERSION = 5;
const FORM_GUIDES = {
  legPress:{
    source:"NASM",
    url:"https://www.youtube.com/watch?v=cDGOn-yfKJA",
    sourceUrl:"https://www.nasm.org/resource-center/exercise-library/leg-press",
    cues:["Adjust the seat so you can keep your hips and back supported throughout the rep.","Place your whole foot on the platform and track your knees in line with your toes.","Press smoothly, stopping just short of locking your knees, then return with control."],
    watchFor:"Avoid letting your hips curl away from the pad at the bottom or snapping your knees straight at the top."
  },
  gluteDrive:{
    source:"Nautilus / Core Health & Fitness",
    url:"https://player.vimeo.com/video/322120209?title=0&byline=0&portrait=0",
    sourceUrl:"https://info.corehandf.com/glute-drive",
    cues:["Center the padded belt low across your pelvis and plant your whole foot on the platform.","Keep your ribs down and drive through your heels as your hips rise.","Finish by squeezing your glutes without pushing your lower back past neutral."],
    watchFor:"Avoid placing the belt across your abdomen or finishing the rep by arching your lower back."
  },
  legExtension:{
    source:"PureGym",
    url:"https://www.youtube.com/watch?v=4ZDm5EbiFI8",
    sourceUrl:"https://www.puregym.com/exercises/legs/quad-exercises/leg-extensions/",
    cues:["Align your knee with the machine pivot and place the roller just above your ankles.","Keep your back and hips against the pads while you straighten your knees.","Pause briefly at the top, then lower the weight under control."],
    watchFor:"Avoid kicking the weight with momentum or forcing your knees into a painful range."
  },
  legCurl:{
    source:"NASM",
    url:"https://www.youtube.com/watch?v=_2Kd0d-JEUM",
    sourceUrl:"https://www.nasm.org/resource-center/exercise-library/seated-leg-curl",
    cues:["Align your knees with the machine pivot and secure the thigh pad comfortably.","Keep your hips and back against the seat as you curl your heels down and back.","Pause in the shortened position, then let the weight return slowly."],
    watchFor:"Avoid lifting your hips off the seat or letting the weight stack pull your legs forward."
  },
  hipAbduction:{
    source:"PureGym",
    url:"https://www.youtube.com/watch?v=G_8LItOiZ0Q",
    sourceUrl:"https://www.puregym.com/exercises/legs/inner-outer-thigh/seated-hip-abduction/",
    cues:["Set the pads against the outside of your knees and sit with your back supported.","Press your knees outward only as far as your hips comfortably allow.","Pause briefly, then bring the pads together slowly."],
    watchFor:"Avoid bouncing out of the closed position or rocking your torso to move more weight."
  },
  hipAdduction:{
    source:"PureGym",
    url:"https://www.youtube.com/watch?v=CjAVezAggkI",
    sourceUrl:"https://www.puregym.com/exercises/legs/inner-outer-thigh/seated-hip-adduction/",
    cues:["Set a comfortable starting width before releasing the adjustment lever.","Keep your back supported and squeeze your thighs together smoothly.","Pause near the center, then let the pads open under control."],
    watchFor:"Avoid forcing an excessive inner-thigh stretch or allowing the weight to pull your legs apart."
  },
  inclinePress:{
    source:"NASM",
    url:"https://www.youtube.com/watch?v=JKnpHchOWPU",
    sourceUrl:"https://www.nasm.org/resource-center/exercise-library/two-arm-incline-dumbbell-chest-press",
    cues:["Use a low-to-moderate incline and keep both feet planted.","Keep your shoulder blades supported and wrists stacked over elbows.","Lower with control only as far as your shoulders comfortably allow."],
    watchFor:"Avoid excessive lower-back arching or letting the dumbbells drift toward your face."
  },
  seatedRow:{
    source:"NASM",
    url:"https://www.youtube.com/watch?v=k0cTJCfxa0Y",
    sourceUrl:"https://www.nasm.org/resource-center/exercise-library/seated-machine-row-close-grip",
    cues:["Adjust the seat and chest support before selecting a working weight.","Keep your chest tall and pull your elbows back without shrugging.","Return the handles slowly instead of letting the stack pull you forward."],
    watchFor:"Avoid leaning backward to turn the row into a momentum-driven movement."
  },
  leverRow:{
    source:"NASM · row pattern",
    url:"https://www.youtube.com/watch?v=k0cTJCfxa0Y",
    sourceUrl:"https://www.nasm.org/resource-center/exercise-library/seated-machine-row-close-grip",
    cues:["Adjust the seat so your chest stays supported and the handles are within a comfortable reach.","Brace against the pad and pull your elbows back without shrugging.","Let your shoulder blades move naturally as you return the handles under control."],
    watchFor:"Avoid lifting your chest away from the pad or using torso momentum to finish the pull."

function cloneGuide(guide){ return guide ? JSON.parse(JSON.stringify(guide)) : null; }
function normName(s){ return String(s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim(); }
function recommendedGuideFor(ex){
  const n=normName(ex&&ex.name), model=normName(ex&&ex.model);
  if(["leg press","leg press machine","seated leg press","45 degree leg press"].includes(n)) return FORM_GUIDES.legPress;
  if(["glute press","glute drive","glute press machine","glute drive machine","hip thrust machine"].includes(n)) return FORM_GUIDES.gluteDrive;
  if(["leg extension","leg extensions","leg extension machine"].includes(n)) return FORM_GUIDES.legExtension;
  if(["hamstring curl","hamstring curls","hamstring curl machine","leg curl","leg curls","seated leg curl","lying leg curl"].includes(n)) return FORM_GUIDES.legCurl;
  if(["hip abduction","hip abduction machine","hip abductor","hip abductor machine"].includes(n)) return FORM_GUIDES.hipAbduction;
  if(["hip adduction","hip adduction machine","hip adductor","hip adductor machine"].includes(n)) return FORM_GUIDES.hipAdduction;
  if(["incline dumbbell chest press","incline dumbbell press","incline db chest press","incline db press"].includes(n)) return FORM_GUIDES.inclinePress;
  if(["seated row","seated row machine","machine seated row"].includes(n)) return FORM_GUIDES.seatedRow;
  if(["lever row","nautilus lever row","incline lever row","chest supported lever row"].includes(n)) return FORM_GUIDES.leverRow;
  if(["chest press","chest press machine","machine chest press"].includes(n)) return FORM_GUIDES.chestPress;
  if(["rear delt fly","rear delt flies","rear deltoid fly","rear deltoid flies","reverse fly","reverse flies"].includes(n)) return FORM_GUIDES.rearDeltFly;
  if(["triceps extension","tricep extension","machine triceps extension","machine tricep extension"].includes(n) && (model.includes("machine")||model.includes("nautilus"))) return FORM_GUIDES.machineTricepsExtension;
  if(["standing overhead press","standing shoulder press","military press","standing barbell press"].includes(n)) return FORM_GUIDES.standingOverheadPress;
  if(["dumbbell bicep curls reclining","dumbbell biceps curls reclining","reclining dumbbell curl","reclining dumbbell curls","incline dumbbell curl","incline dumbbell curls","incline bicep curl","incline bicep curls","incline biceps curl","incline biceps curls"].includes(n)) return FORM_GUIDES.inclineDumbbellCurl;
  if(["dumbbell lateral raise","dumbbell lateral raises","db lateral raise","db lateral raises"].includes(n)) return FORM_GUIDES.lateralRaise;
  if(["lateral raise","lateral raises"].includes(n) && model.includes("dumbbell") && !model.includes("machine") && !model.includes("nautilus")) return FORM_GUIDES.lateralRaise;
  if(["overhead tricep extension","overhead triceps extension","overhead db tricep extension","overhead db triceps extension","overhead dumbbell tricep extension","overhead dumbbell triceps extension"].includes(n)) return FORM_GUIDES.tricepsExtension;
  if(["dumbbell hammer curl","dumbbell hammer curls","db hammer curl","db hammer curls","hammer curl","hammer curls"].includes(n)) return FORM_GUIDES.hammerCurl;
  if(["dead bug","dead bugs","deadbug","deadbugs"].includes(n)) return FORM_GUIDES.deadBug;
  if(n==="rkc plank") return FORM_GUIDES.rkcPlank;
  if(["stomach vacuum","stomach vacuums","abdominal vacuum","abdominal vacuums"].includes(n)) return FORM_GUIDES.stomachVacuum;
  if(["romanian dead lift","romanian deadlift","dumbbell romanian dead lift","dumbbell romanian deadlift","kettlebell romanian dead lift","kettlebell romanian deadlift","rdl"].includes(n)) return FORM_GUIDES.romanianDeadlift;
  return null;
}
function migrateState(data){
  if(!data||!Array.isArray(data.exercises)) return false;
  let changed=false, previousVersion=data.version||0;
  data.exercises.forEach(ex=>{
    const guide=recommendedGuideFor(ex);
    if(!Object.prototype.hasOwnProperty.call(ex,"formGuide")){
      if(guide){ ex.formGuide=cloneGuide(guide); changed=true; }
    }
    else if(previousVersion<4&&guide&&ex.formGuide&&LEGACY_AUTO_GUIDE_URLS.has(ex.formGuide.url)){
      ex.formGuide=cloneGuide(guide); changed=true;
    }
  });
  if((data.version||0)<STATE_VERSION){ data.version=STATE_VERSION; changed=true; }
  return changed;
}
function safeHttpUrl(value){
  try{ const u=new URL(value); return (u.protocol==="https:"||u.protocol==="http:") ? u.href : ""; }catch(e){ return ""; }
}
function youtubeId(value){
  try{
    const u=new URL(value), host=u.hostname.replace(/^www\./,"");
    if(host==="youtu.be") return u.pathname.split("/").filter(Boolean)[0]||"";
    if(host==="youtube.com"||host==="m.youtube.com"||host==="youtube-nocookie.com"){
      if(u.pathname==="/watch") return u.searchParams.get("v")||"";
      const parts=u.pathname.split("/").filter(Boolean); if(["embed","shorts"].includes(parts[0])) return parts[1]||"";
    }
  }catch(e){}
  return "";
}
function vimeoEmbedUrl(value){
  try{
    const u=new URL(value), host=u.hostname.replace(/^www\./,""), parts=u.pathname.split("/").filter(Boolean);
    if(host==="player.vimeo.com"&&parts[0]==="video"&&/^\d+$/.test(parts[1]||"")) return u.href;
    if(host==="vimeo.com"&&/^\d+$/.test(parts[0]||"")) return `https://player.vimeo.com/video/${parts[0]}`;
  }catch(e){}
  return "";
}
function guideMediaHtml(guide,exerciseName){
  const url=safeHttpUrl(guide&&guide.url); if(!url) return `<div class="form-media"><div class="form-media-fallback">No playable demonstration link is saved.</div></div>`;
  const yt=youtubeId(url);
  if(yt){
    const origin=(location.protocol==="https:"||location.protocol==="http:")?`&origin=${encodeURIComponent(location.origin)}`:"";
    return `<div class="form-media"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt)}?rel=0&playsinline=1${origin}" title="${esc(exerciseName)} form demonstration" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
  }
  const vimeo=vimeoEmbedUrl(url);
  if(vimeo) return `<div class="form-media"><iframe src="${esc(vimeo)}" title="${esc(exerciseName)} form demonstration" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
  if(/\.mp4(?:$|\?)/i.test(url)) return `<div class="form-media"><video src="${esc(url)}" controls autoplay muted loop playsinline preload="metadata"></video></div>`;
  return `<div class="form-media"><div class="form-media-fallback">This reference opens on its source site.</div></div>`;
}

/* ---------- lookups ---------- */
function exerciseById(id){ return state.exercises.find(e=>e.id===id); }
function workoutById(id){ return state.workouts.find(w=>w.id===id); }
function sessionsFor(workoutId){ return state.sessions.filter(s=>s.workoutId===workoutId).sort((a,b)=>a.date<b.date?1:-1); }
function todaySession(workoutId){ return state.sessions.find(s=>s.workoutId===workoutId && s.date===todayISO()) || null; }
function lastSessionContaining(exId, beforeISO){
  return state.sessions.filter(s=> s.date<beforeISO && s.entries.some(e=>e.exerciseId===exId)).sort((a,b)=>a.date<b.date?1:-1)[0] || null;
}
function buildSets(exId, beforeISO, defaultN){
  const prev = lastSessionContaining(exId, beforeISO);
  const pe = prev ? prev.entries.find(e=>e.exerciseId===exId) : null;
  const n = pe ? pe.sets.length : (defaultN||2);
  const sets=[];
  for(let i=0;i<n;i++){ const ps = pe&&pe.sets[i]?pe.sets[i]:(pe&&pe.sets.length?pe.sets[pe.sets.length-1]:null); sets.push({weight:ps?ps.weight:null,reps:ps?ps.reps:null,done:false}); }
  return sets;
}
function getOrCreateTodaySession(workoutId){
  let s = todaySession(workoutId); if(s) return s;
  const w = workoutById(workoutId);
  s = { id:uid("s"), date:todayISO(), workoutId, exerciseIds:[...w.exerciseIds], entries:[] };
  w.exerciseIds.forEach(exId=>{ const ex=exerciseById(exId); s.entries.push({ exerciseId:exId, sets:buildSets(exId, s.date, ex?ex.defaultSets:2) }); });
  state.sessions.push(s); saveLocal(); return s;
}
function entryFor(session, exId){
  let e = session.entries.find(x=>x.exerciseId===exId);
  if(!e){ e={exerciseId:exId, sets:[{weight:null,reps:null,done:false}]}; session.entries.push(e); }
  return e;
}
function exDone(session, exId){ const e=session.entries.find(x=>x.exerciseId===exId); return !!(e && e.sets.length && e.sets.every(s=>s.done)); }

function workoutsSummary(){
  const dates=workedOutDates();
  if(!dates.size) return "";
  const ym=todayISO().slice(0,7);
  let monthCount=0; dates.forEach(d=>{ if(d.slice(0,7)===ym) monthCount++; });
  const last=[...dates].sort()[dates.size-1];
  let strip=""; for(let i=13;i>=0;i--){ const di=isoShift(-i); strip+=`<span class="d ${dates.has(di)?"on":""}"></span>`; }
  return `<button class="card summary" onclick="go('history')">
    <span><span class="snum">${monthCount}</span><span class="slab">This month</span></span>
    <span class="sright"><span class="dotstrip">${strip}</span><span class="slab" style="margin-top:8px; display:block">Last: ${esc(relDay(last))}</span></span>
  </button>`;
}

function setVal(exId,i,key,val){ const s=todaySession(nav.workoutId); if(!s) return; entryFor(s,exId).sets[i][key]=(val===""?null:num(val)); saveLocal(); }
function toggleSet(exId,i){ const s=todaySession(nav.workoutId); if(!s) return; const e=entryFor(s,exId); e.sets[i].done=!e.sets[i].done; saveLocal(); render(); }

/* ---------- progress ---------- */
function viewProgress(){
  const lib = state.exercises;
  if(!lib.length) return `<div class="vhead"><div><div class="eyebrow">Workout Tracker</div><div class="vtitle">Progress</div></div></div><div class="empty"><div class="big">Nothing to chart yet</div></div>`;
  if(!nav.progressEx || !lib.find(e=>e.id===nav.progressEx)) nav.progressEx = lib[0].id;
  const options = lib.map(e=>`<option value="${e.id}" ${e.id===nav.progressEx?"selected":""}>${esc(e.name)}</option>`).join("");

  const points = progressPoints(nav.progressEx);
  const stats = statsBlock(points);
  const chart = points.length ? lineChart(points) : `<div class="empty"><div class="big">No logged sets yet</div>Check off sets and the line shows up here.</div>`;
  return `<div class="vhead"><div><div class="eyebrow">Workout Tracker</div><div class="vtitle">Progress</div></div></div>
    <div class="selectwrap"><select onchange="nav.progressEx=this.value; render()">${options}</select><span class="car"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div>
    ${stats}<div class="card chart-card">${chart}</div>`;
}
function lineChart(points){
  const W=460,H=210,pad=34,padR=14,padT=14,padB=28;
  const xs=points.map((p,i)=> points.length===1 ? pad+(W-pad-padR)/2 : pad+i*(W-pad-padR)/(points.length-1));
  const ws=points.map(p=>p.top); let lo=Math.min(...ws),hi=Math.max(...ws); if(lo===hi){lo-=5;hi+=5;}
  const py=(hi-lo)*0.15; lo-=py; hi+=py;
  const y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
  const pts=points.map((p,i)=>`${round(xs[i])},${round(y(p.top))}`);
  const line=pts.map((p,i)=>(i?"L":"M")+p).join(" ");
  const area=`M${round(xs[0])},${round(H-padB)} `+pts.map(p=>"L"+p).join(" ")+` L${round(xs[xs.length-1])},${round(H-padB)} Z`;
  const dots=points.map((p,i)=>`<circle cx="${round(xs[i])}" cy="${round(y(p.top))}" r="4" fill="var(--card)" stroke="var(--magenta)" stroke-width="2.5"/>`).join("");
  const xl=points.map((p,i)=> (points.length>6&&i%2===1&&i!==points.length-1)?"":`<text x="${round(xs[i])}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--ink3)" font-family="Onest">${fmtShort(p.date)}</text>`).join("");
  const gy=[lo+(hi-lo)*0.5,hi-(hi-lo)*0.08];
  const grid=gy.map(v=>`<line x1="${pad}" y1="${round(y(v))}" x2="${W-padR}" y2="${round(y(v))}" stroke="var(--line)" stroke-width="1"/><text x="${pad-7}" y="${round(y(v))+3}" text-anchor="end" font-size="10" fill="var(--ink3)" font-family="Onest">${Math.round(v)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}<path d="${area}" fill="var(--magenta-soft)"/><path d="${line}" fill="none" stroke="var(--magenta)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

function progressPoints(exId){
  const points=[];
  state.sessions.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(s=>{
    const ent=s.entries.find(x=>x.exerciseId===exId); if(!ent) return;
    const ws=ent.sets.filter(st=>st.done).map(st=>st.weight).filter(w=>w!=null);
    if(ws.length) points.push({ date:s.date, top:Math.max(...ws) });
  });
  return points;
}
function statsBlock(points){
  if(!points.length) return "";
  const latest=points[points.length-1].top, best=Math.max(...points.map(p=>p.top)), delta=round(latest-points[0].top);
  return `<div class="stat-row">
    <div class="stat"><div class="lab">Current</div><div class="val">${round(latest)}<span class="su"> lbs</span></div></div>
    <div class="stat"><div class="lab">Best</div><div class="val">${round(best)}<span class="su"> lbs</span></div></div>
    <div class="stat"><div class="lab">Since start</div><div class="val">${delta>=0?"+":""}${delta}<span class="su"> lbs</span></div></div></div>`;
}
function viewWorkoutProgress(){
  const w=workoutById(nav.workoutId); if(!w) return viewWorkouts();
  const blocks=w.exerciseIds.map(exId=>{
    const e=exerciseById(exId); if(!e) return "";
    const points=progressPoints(exId);
    const body = points.length
      ? `${statsBlock(points)}<div class="card chart-card">${lineChart(points)}</div>`
      : `<div class="card chart-card"><div class="empty"><div class="big">No logged sets yet</div>Log a set and the line shows up here.</div></div>`;
    return `<div class="wp-block"><div class="wp-exname">${esc(e.name)}</div>${body}</div>`;
  }).join("");
  return `<div class="vhead">
      <div><div class="eyebrow" onclick="go('session','${w.id}')" style="cursor:pointer">&larr; ${esc(w.name)}</div><div class="vtitle">Progress</div></div></div>
    ${blocks || `<div class="empty"><div class="big">Nothing to chart yet</div></div>`}`;
}

/* ---------- history / calendar ---------- */
function isoShift(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function sessionLogged(s){ return (s.entries||[]).some(e=>(e.sets||[]).some(st=>st.done)); }
function workedOutDates(){ const set=new Set(); state.sessions.forEach(s=>{ if(sessionLogged(s)) set.add(s.date); }); return set; }
function sessionsOnDate(iso){ return state.sessions.filter(s=>s.date===iso && sessionLogged(s)); }
function relDay(iso){
  const today=todayISO(); if(iso===today) return "Today";
  const diff=Math.round((new Date(today+"T00:00:00")-new Date(iso+"T00:00:00"))/86400000);
  if(diff===1) return "Yesterday";
  if(diff>1 && diff<7) return diff+" days ago";
  return fmtShort(iso);
}
function viewHistory(){
  if(!nav.cal){ const d=new Date(); nav.cal={y:d.getFullYear(),m:d.getMonth()}; }
  const {y,m}=nav.cal;
  const dates=workedOutDates();
  const todayI=todayISO();
  const p=n=>String(n).padStart(2,"0");
  const monthKey=`${y}-${p(m+1)}`;
  const iso=d=>`${monthKey}-${p(d)}`;
  const first=new Date(y,m,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const title=first.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const dow=["S","M","T","W","T","F","S"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const di=iso(d), on=dates.has(di), isToday=di===todayI, future=di>todayI;
    const cls=["cal-cell",on?"on":"",isToday?"today":"",future?"future":""].filter(Boolean).join(" ");
    cells+=`<div class="${cls}" ${on?`onclick="dayDetail('${di}')"`:""}>${d}</div>`;
  }
  let monthCount=0; dates.forEach(d=>{ if(d.slice(0,7)===monthKey) monthCount++; });
  const nextDisabled = (y>new Date().getFullYear()) || (y===new Date().getFullYear() && m>=new Date().getMonth());
  return `<div class="vhead"><div><div class="eyebrow">Workout Tracker</div><div class="vtitle">History</div></div></div>
    <div class="card">
      <div class="cal-head">
        <button class="icobtn" aria-label="Previous month" onclick="calMove(-1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="cal-title">${esc(title)}</div>
        <button class="icobtn" aria-label="Next month" onclick="calMove(1)" ${nextDisabled?"disabled style=\"opacity:.35\"":""}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="cal-grid">${dow}${cells}</div>
      <div class="cal-legend">
        <span class="lg"><span class="sw" style="background:var(--magenta)"></span>Worked out</span>
        <span class="lg"><span class="sw" style="background:var(--field); outline:2px solid var(--violet); outline-offset:-2px"></span>Today</span>
        <span style="margin-left:auto; color:var(--ink3)">${monthCount} this month</span>
      </div>
    </div>`;
}
function calMove(delta){
  if(delta>0){ const now=new Date(); if(nav.cal.y>now.getFullYear() || (nav.cal.y===now.getFullYear() && nav.cal.m>=now.getMonth())) return; }
  let {y,m}=nav.cal; m+=delta; if(m<0){m=11;y--;} if(m>11){m=0;y++;} nav.cal={y,m}; render();
}
function dayDetail(iso){
  const ss=sessionsOnDate(iso);
  const rows=ss.map(s=>{
    const w=workoutById(s.workoutId);
    const n=(s.entries||[]).filter(e=>(e.sets||[]).some(st=>st.done)).length;
    return `<div class="card drow" style="margin-bottom:8px"><span class="dbody"><span class="dt">${esc(w?w.name:"Workout")}</span><span class="ds">${n} exercise${n===1?"":"s"} logged</span></span></div>`;
  }).join("");
  openSheet(`<h2>${esc(fmtDate(iso))}</h2><div class="sub">What you logged this day.</div>${rows||`<div class="sub">Nothing logged.</div>`}<button class="btn btn-soft btn-block" style="margin-top:6px" onclick="closeSheet()">Close</button>`);
}

async function idb(mode,key,val){ return new Promise(res=>{ const o=indexedDB.open("wt_kv",1); o.onupgradeneeded=()=>o.result.createObjectStore("kv"); o.onsuccess=()=>{ const db=o.result,tx=db.transaction("kv",mode==="get"?"readonly":"readwrite"),st=tx.objectStore("kv"); if(mode==="get"){const r=st.get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);} else {st.put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);} }; o.onerror=()=>res(null); }); }
async function linkFile(){ try{ fileHandle=await window.showSaveFilePicker({suggestedName:"workout-data.json",types:[{description:"Workout data",accept:{"application/json":[".json"]}}]}); await idb("set","fileHandle",fileHandle); await writeHandle(); toast("File linked."); render(); }catch(e){ if(e&&e.name!=="AbortError") toast("Could not link file."); } }
async function ensurePerm(){ if(!fileHandle) return false; const o={mode:"readwrite"}; if(await fileHandle.queryPermission(o)==="granted") return true; return (await fileHandle.requestPermission(o))==="granted"; }
function exportStamp(){ return new Date().toLocaleString(); }
function exportFileName(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return `workout-data-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`; }
function dataOut(status){ return Object.assign({}, state, {_lastSaved:status||state._lastSaved||null}); }
function markExportStatus(status){ state._lastSaved=status; saveLocal(); }
function hasLoggedData(){ return state.sessions.some(s=>(s.entries||[]).some(e=>(e.sets||[]).some(st=>st.weight!=null||st.reps!=null||st.done))); }
async function writeHandle(){
  if(!await ensurePerm()) return false;
  const status="Saved to linked file at " + exportStamp();
  const w=await fileHandle.createWritable();
  await w.write(JSON.stringify(dataOut(status),null,2));
  await w.close();
  markExportStatus(status);
  return true;
}
async function saveToFile(){
  if(!hasLoggedData()){ toast("Nothing logged yet. Save skipped so it won't overwrite your backup."); return; }
  if(fileHandle && ("showSaveFilePicker" in window)){ try{ if(await writeHandle()){ toast("Saved to "+fileHandle.name); render(); return; } }catch(e){} }
  if(!("showSaveFilePicker" in window) && ("share" in navigator)){ await shareBackup(); return; }
  downloadBackup();
}
function buildBackupFile(method){
  const name=exportFileName();
  const status=method + " at " + exportStamp() + " as " + name;
  const blob=new Blob([JSON.stringify(dataOut(status),null,2)],{type:"application/json"});
  return {name,status,blob,file:new File([blob],name,{type:"application/json"})};
}
function downloadBackup(){
  if(!hasLoggedData()){ toast("Nothing logged yet. Save skipped so it won't overwrite your backup."); return; }
  const backup=buildBackupFile("Downloaded backup");
  const url=URL.createObjectURL(backup.blob); const a=document.createElement("a"); a.href=url; a.download=backup.name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  markExportStatus(backup.status); toast("Downloaded "+backup.name); render();
}
async function shareBackup(){
  const backup=buildBackupFile("Shared backup");
  if(navigator.canShare && navigator.canShare({files:[backup.file]})){
    try{ await navigator.share({files:[backup.file]}); markExportStatus(backup.status); toast("Saved "+backup.name); render(); return; }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  downloadBackup();
}
async function importFile(input){
  const f=input.files&&input.files[0]; input.value=""; if(!f) return;
  try{ const data=JSON.parse(await f.text()); if(!data||!Array.isArray(data.workouts)||!Array.isArray(data.exercises)) throw 0;
    confirmSheet("Load this file?",`It has ${data.exercises.length} exercises and ${(data.sessions||[]).length} sessions. This replaces what's on this device.`,()=>{ state=data; migrateState(state); saveLocal(); closeSheet(); go("workouts"); toast("Loaded."); });
  }catch(e){ toast("That file could not be read."); }
}

    <div class="field"><label>Machine / model</label><input id="f_model" value="${e?esc(e.model||""):""}" placeholder="Nautilus Inspiration"></div>
    <div class="field"><label>Location <span class="muted3">(where to find it)</span></label><input id="f_loc" value="${e?esc(e.location||""):""}" placeholder="Back wall, left"></div>
    <div class="field"><label>Machine settings</label><input id="f_set" value="${e?esc(e.settings||""):""}" placeholder="Seat - 7"></div>
    <div class="field"><label>Body part</label><input id="f_bp" value="${e?esc(e.bodyPart||""):""}" placeholder="Quads, glutes"></div>
    <div class="field-2"><div class="field"><label>Target sets</label><input id="f_sets" inputmode="numeric" value="${e?e.defaultSets:2}"></div><div class="field"><label>Target reps</label><input id="f_reps" value="${e?esc(e.defaultReps||""):""}" placeholder="10-12"></div></div>
    <div class="guide-fields"><div class="group-label">Form guide <span class="muted3">(optional)</span></div><div class="group-help">Paste a YouTube, Vimeo, or direct MP4 link. Media loads only when you tap Form.</div>
      <div class="field"><label>Demonstration link</label><input id="f_guide_url" value="${guide?esc(guide.url||""):""}" placeholder="https://youtube.com/watch?v=..."></div>
      <div class="field-2"><div class="field"><label>Source / credit</label><input id="f_guide_source" value="${guide?esc(guide.source||""):""}" placeholder="Trainer or library"></div><div class="field"><label>Source page</label><input id="f_guide_source_url" value="${guide?esc(guide.sourceUrl||""):""}" placeholder="Optional"></div></div>
      <div class="field"><label>Key cues <span class="muted3">(one per line)</span></label><textarea id="f_guide_cues" placeholder="Keep your ribs down&#10;Move with control">${guide&&Array.isArray(guide.cues)?esc(guide.cues.join("\n")):""}</textarea></div>
      <div class="field"><label>Watch for</label><textarea id="f_guide_watch" placeholder="One common mistake">${guide?esc(guide.watchFor||""):""}</textarea></div>
    </div>
    ${e?"":scopePicker(wname)}
    <div class="sheet-actions"><button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" style="flex:1" onclick="saveExercise('${exId||""}')">Save</button></div>
    ${e?`<div class="rmrow"><button class="linkdanger" onclick="skipToday('${exId}')">Remove today only</button>${workoutById(nav.workoutId).exerciseIds.includes(exId)?`<button class="linkdanger" onclick="removeFromPlanConfirm('${exId}')">Remove from template + today</button>`:""}</div>`:""}`);
  setTimeout(()=>{ const el=document.getElementById("f_nm"); if(el) el.focus(); },50);
}
function saveExercise(exId){
  const g=id=>(document.getElementById(id).value||"").trim();
  const nm=g("f_nm"); if(!nm){ toast("Name it first."); return; }
  const guideUrl=g("f_guide_url"), sourceUrl=g("f_guide_source_url");
  if(guideUrl&&!safeHttpUrl(guideUrl)){ toast("Use a full http or https video link."); return; }
  if(sourceUrl&&!safeHttpUrl(sourceUrl)){ toast("Use a full http or https source link."); return; }
  const formGuide=guideUrl?{ url:safeHttpUrl(guideUrl), source:g("f_guide_source"), sourceUrl:sourceUrl?safeHttpUrl(sourceUrl):safeHttpUrl(guideUrl), cues:g("f_guide_cues").split(/\r?\n/).map(x=>x.trim()).filter(Boolean), watchFor:g("f_guide_watch") }:null;
  const fields={ name:nm, model:g("f_model"), location:g("f_loc"), settings:g("f_set"), bodyPart:g("f_bp"), defaultSets:Math.max(1,parseInt(g("f_sets"))||1), defaultReps:g("f_reps"), formGuide };
  if(exId){
    const existing=exerciseById(exId), canRecommend=!Object.prototype.hasOwnProperty.call(existing,"formGuide");
    Object.assign(existing,fields);
    if(canRecommend&&!existing.formGuide){ const recommended=recommendedGuideFor(existing); if(recommended) existing.formGuide=cloneGuide(recommended); }
  }
  else {
    const ex=Object.assign({id:uid("e")},fields);
    if(!ex.formGuide){ const recommended=recommendedGuideFor(ex); if(recommended) ex.formGuide=cloneGuide(recommended); }
    state.exercises.push(ex);
    addExerciseToScope(ex.id,currentAddScope(),false);
  }
  saveLocal(); closeSheet(); render();
}
function skipToday(exId){
  const s=todaySession(nav.workoutId); if(s){ s.exerciseIds=s.exerciseIds.filter(x=>x!==exId); s.entries=s.entries.filter(e=>e.exerciseId!==exId); }
  saveLocal(); closeSheet(); render(); toast("Removed from today. Template unchanged.");
}
function removeFromPlanConfirm(exId){
  const ex=exerciseById(exId);
  confirmSheet("Remove from template?",`${ex?ex.name:"This exercise"} will be removed from this workout template and from today's session. Logged history stays.`,()=>removeFromPlan(exId));
}
function removeFromPlan(exId){
  const w=workoutById(nav.workoutId); if(w) w.exerciseIds=w.exerciseIds.filter(x=>x!==exId);
  const s=todaySession(nav.workoutId); if(s){ s.exerciseIds=s.exerciseIds.filter(x=>x!==exId); s.entries=s.entries.filter(e=>e.exerciseId!==exId); }
  saveLocal(); closeSheet(); render(); toast("Removed from template and today.");
}
function scopePicker(wname){
  return `<div class="scopegrid" role="radiogroup" aria-label="Add exercise scope">
    <label class="scopecard"><input type="radio" name="f_scope" value="both" checked><span><strong>Today + template</strong>Show it now and keep it in ${wname} next time.</span></label>
    <label class="scopecard"><input type="radio" name="f_scope" value="today"><span><strong>Today only</strong>Use it for this dated session without changing the plan.</span></label>
    <label class="scopecard"><input type="radio" name="f_scope" value="template"><span><strong>Template only</strong>Add it to ${wname} for future sessions, not today.</span></label>
  </div>`;
}
function currentAddScope(){
  const el=document.querySelector('input[name="f_scope"]:checked');
  return el ? el.value : "both";
}
function addExerciseToScope(exId,scope,shouldRender=true){
  const ex=exerciseById(exId); if(!ex) return;
  const w=workoutById(nav.workoutId);
  const s=todaySession(nav.workoutId);
  let changedToday=false, changedTemplate=false;
  if((scope==="today"||scope==="both") && s && !s.exerciseIds.includes(exId)){
    s.exerciseIds.push(exId);
    s.entries.push({exerciseId:exId, sets:buildSets(exId,s.date,ex.defaultSets)});
    changedToday=true;
  }
  if((scope==="template"||scope==="both") && w && !w.exerciseIds.includes(exId)){
    w.exerciseIds.push(exId);
    changedTemplate=true;
  }
  if(shouldRender){
    saveLocal(); closeSheet(); render();
    toast(changedToday&&changedTemplate?"Added today and to template.":changedTemplate?"Added to template for next time.":changedToday?"Added to today only.":"Already there.");
  }
}
function addExerciseSheet(){
  const w=workoutById(nav.workoutId);
  const wname=esc(w.name);
  const s=todaySession(nav.workoutId); const inSession=new Set(s?s.exerciseIds:[]);
  const inPlan=new Set(w?w.exerciseIds:[]);
  const avail=state.exercises.filter(e=>!(inSession.has(e.id)&&inPlan.has(e.id)));
  const rows=avail.map(e=>{
    const status = inSession.has(e.id) ? "today" : inPlan.has(e.id) ? "template" : "";
    return `<button class="card drow" style="margin-bottom:8px" onclick="addExisting('${e.id}')"><span class="dbody"><span class="dt">${esc(e.name)}</span><span class="ds">${esc(e.model||"")}</span></span><span class="muted3" style="font-weight:700">${status?esc(status):"add"}</span></button>`;
  }).join("");
  openSheet(`<h2>Add exercise</h2><div class="sub">Choose whether this changes today, ${wname}, or both.</div>
    ${scopePicker(wname)}
    ${rows?`<div style="margin:16px 0 6px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3)">From your library</div>${rows}`:""}
    <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="editExercise()">Create new exercise</button>
    <button class="btn btn-soft btn-block" style="margin-top:10px" onclick="closeSheet()">Cancel</button>`);
}
function addExisting(exId){
  addExerciseToScope(exId,currentAddScope());
}

function confirmSheet(title,msg,onYes){ openSheet(`<h2>${esc(title)}</h2><div class="sub">${esc(msg)}</div><div class="sheet-actions"><button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">Cancel</button><button class="btn btn-magenta" style="flex:1" id="confirmYes">Yes</button></div>`); document.getElementById("confirmYes").onclick=onYes; }
let toastT=null;
function toast(msg){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--violet-btn);color:#fff;padding:11px 18px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:14px;z-index:99;max-width:88%;text-align:center;transition:opacity .25s;opacity:0;"; document.body.appendChild(t); } t.textContent=msg; t.style.opacity="1"; clearTimeout(toastT); toastT=setTimeout(()=>{t.style.opacity="0";},2200); }

(async function(){ state=loadLocal()||seed(); if(migrateState(state)) saveLocal(); try{ const h=await idb("get","fileHandle"); if(h) fileHandle=h; }catch(e){} render(); })();
</script>
</body>
</html>
